<!-- ⚡ Live Mode Access Widget -->
<div id="_liveWidget" style="position:fixed;bottom:20px;right:20px;z-index:99999;font-family:system-ui,sans-serif;">
  <div id="_livePanel" style="display:none;position:absolute;bottom:52px;right:0;background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,0.15);width:210px;">
    <div style="font-size:13px;font-weight:600;color:#1A202C;margin-bottom:10px;">Developer Access</div>
    <input type="password" id="_liveInput" placeholder="Access code" autocomplete="off"
      style="width:100%;padding:8px 12px;border:1px solid #CBD5E0;border-radius:8px;font-size:13px;margin-bottom:8px;box-sizing:border-box;"
      onkeydown="if(event.key=="Enter")_checkLive()">
    <button onclick="_checkLive()" style="width:100%;background:#1A202C;color:#fff;border:none;padding:8px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Unlock</button>
    <div id="_liveErr" style="color:#C53030;font-size:12px;margin-top:6px;display:none;">Incorrect code</div>
  </div>
  <button id="_liveBtn" onclick="_toggleLive()" title="Developer access"
    style="width:40px;height:40px;border-radius:50%;border:2px solid #E2E8F0;cursor:pointer;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.12);font-size:16px;transition:all 0.2s;">🔒</button>
</div>
<script>(function(){var K="royaLive",P="stockholm1";function on(){var b=document.getElementById("_liveBtn");b.style.background="#2B6F4B";b.style.border="2px solid #2B6F4B";b.style.color="#fff";b.textContent="⚡";b.title="Live Mode active — click to exit";}if(localStorage.getItem(K)===P)on();window._toggleLive=function(){if(localStorage.getItem(K)===P){if(confirm("Exit live mode?")){{localStorage.removeItem(K);location.reload();}}return;}var p=document.getElementById("_livePanel");p.style.display=p.style.display==="none"?"block":"none";if(p.style.display==="block")setTimeout(function(){document.getElementById("_liveInput").focus();},40);};window._checkLive=function(){if(document.getElementById("_liveInput").value===P){localStorage.setItem(K,P);document.getElementById("_livePanel").style.display="none";on();}else{var e=document.getElementById("_liveErr");e.style.display="block";document.getElementById("_liveInput").value="";setTimeout(function(){e.style.display="none";},2000);}};})();</script>
